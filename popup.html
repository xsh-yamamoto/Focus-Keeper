<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 300px; font-family: sans-serif; padding: 15px; text-align: center; color: #333; }
    h2 { margin-top: 0; margin-bottom: 10px; font-size: 1.2em;}
    
    /* タイマー部分 */
    .timer-section { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    .timer-display { font-size: 2.5em; font-weight: bold; margin: 10px 0; color: #2196F3; }
    .inputs { display: flex; justify-content: space-around; margin-bottom: 10px; }
    .input-group { display: flex; flex-direction: column; }
    label { font-size: 0.8em; color: #666; }
    input { width: 50px; padding: 5px; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
    select { width: 100%; padding: 5px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px;}

    /* ボタン */
    button {
      border: none; padding: 10px 0; border-radius: 5px; cursor: pointer; font-size: 1em; width: 100%; transition: 0.2s;
    }
    #startBtn { background-color: #2196F3; color: white; font-weight: bold; }
    #startBtn:hover { background-color: #1976D2; }
    #resetBtn { background-color: #e0e0e0; color: #333; margin-top: 8px; font-size: 0.9em; }
    
    .status { font-weight: bold; color: #4CAF50; min-height: 1.2em; }

    /* 履歴セクション */
    .history-section { border-top: 1px solid #eee; padding-top: 10px; text-align: left; }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .history-header h3 { margin: 0; font-size: 0.9em; color: #555; }
    .download-btn { background: none; border: 1px solid #2196F3; color: #2196F3; padding: 3px 8px; font-size: 0.8em; border-radius: 4px; width: auto; }
    .download-btn:hover { background: #E3F2FD; }
    
    #historyList { list-style: none; padding: 0; margin: 0; max-height: 150px; overflow-y: auto; font-size: 0.85em; }
    #historyList li { border-bottom: 1px solid #f0f0f0; padding: 5px 0; display: flex; justify-content: space-between; align-items: center; }
    #historyList li:last-child { border-bottom: none; }
    .history-category { font-size: 0.8em; color: #666; background: #eee; padding: 2px 6px; border-radius: 4px; margin-right: 5px;}
    .no-history { color: #999; text-align: center; padding: 10px; }
  </style>
</head>
<body>
  <h2>Focus Keeper 📊</h2>
  
  <div class="timer-section">
    <div class="status" id="statusText">待機中</div>
    <div class="timer-display" id="timer">00:00</div>

    <div class="inputs">
      <div class="input-group">
        <label>作業(分)</label>
        <input type="number" id="workTime" value="25" min="1">
      </div>
      <div class="input-group">
        <label>休憩(分)</label>
        <input type="number" id="breakTime" value="5" min="1">
      </div>
    </div>

    <div id="category-area" style="text-align: left; margin-bottom: 10px;">
        <label style="font-size:0.8em; color:#666;">作業内容:</label>
        <select id="workCategory">
            <option value="案件">案件</option>
            <option value="自社作業">自社作業</option>
            <option value="個人作業">個人作業</option>
            <option value="その他">その他</option>
        </select>
    </div>

    <button id="startBtn">作業スタート</button>
    <button id="resetBtn">リセット</button>
  </div>

  <div class="history-section">
    <div class="history-header">
      <h3>作業履歴</h3>
      <button id="downloadBtn" class="download-btn">CSV出力</button>
    </div>
    <ul id="historyList">
      </ul>
    <div style="text-align: right; margin-top: 5px;">
        <button id="clearHistoryBtn" style="background:none; border:none; color:#999; font-size:0.8em; width:auto; text-decoration:underline;">履歴クリア</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
